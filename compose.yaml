name: youtube-studio-automation

x-n8n-environment: &n8n-environment
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: 5432
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: n8n
  DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  N8N_HOST: ${N8N_HOST:?Set N8N_HOST in .env}
  N8N_PORT: ${N8N_PORT:-5678}
  N8N_PROTOCOL: ${N8N_PROTOCOL:-https}
  N8N_EDITOR_BASE_URL: ${N8N_PROTOCOL:-https}://${N8N_HOST}
  WEBHOOK_URL: ${N8N_PROTOCOL:-https}://${N8N_HOST}/
  N8N_PROXY_HOPS: "1"
  GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Seoul}
  TZ: ${GENERIC_TIMEZONE:-Asia/Seoul}
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  N8N_DEFAULT_BINARY_DATA_MODE: filesystem
  # Worker auth is stored as an n8n Header Auth credential instead of exposing
  # every container environment variable to workflow expressions.
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
  EXECUTIONS_DATA_PRUNE: "true"
  EXECUTIONS_DATA_MAX_AGE: "168"
  EXECUTIONS_DATA_PRUNE_MAX_COUNT: "5000"

services:
  postgres:
    image: postgres:16.9-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  video-worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    environment:
      VIDEO_WORKER_TOKEN: ${VIDEO_WORKER_TOKEN:?Set VIDEO_WORKER_TOKEN in .env}
      VIDEO_WORKER_BASE_URL: ${VIDEO_WORKER_BASE_URL:-http://video-worker:8000}
      STUDIO_HOST: ${STUDIO_HOST:?Set STUDIO_HOST in .env}
      STUDIO_ACCESS_PASSWORD: ${STUDIO_ACCESS_PASSWORD:?Set STUDIO_ACCESS_PASSWORD in .env}
      STUDIO_SESSION_SECRET: ${STUDIO_SESSION_SECRET:?Set STUDIO_SESSION_SECRET in .env}
      STUDIO_SESSION_DAYS: ${STUDIO_SESSION_DAYS:-30}
      STUDIO_SECURE_COOKIE: "true"
      MAX_CHAT_IMAGE_MB: ${MAX_CHAT_IMAGE_MB:-10}
      MAX_CHAT_IMAGES: ${MAX_CHAT_IMAGES:-5}
      CHAT_HISTORY_MESSAGES: ${CHAT_HISTORY_MESSAGES:-40}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      YOUTUBE_DATA_API_KEY: ${YOUTUBE_DATA_API_KEY:-}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      TTS_PROVIDER: ${TTS_PROVIDER:-edge}
      TTS_VOICE: ${TTS_VOICE:-ko-KR-SunHiNeural}
      GOOGLE_TTS_API_KEY: ${GOOGLE_TTS_API_KEY:-}
      GOOGLE_TTS_VOICE: ${GOOGLE_TTS_VOICE:-ko-KR-Neural2-A}
      VIDEO_RETENTION_DAYS: ${VIDEO_RETENTION_DAYS:-7}
      MAX_VIDEO_SECONDS: ${MAX_VIDEO_SECONDS:-60}
      DATA_DIR: /data
      TZ: ${GENERIC_TIMEZONE:-Asia/Seoul}
    volumes:
      - video_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [backend]

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.31.6
    restart: unless-stopped
    environment: *n8n-environment
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      video-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:5678/healthz/readiness >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks: [backend]

  # Imports the template only once. It remains inactive until YouTube OAuth is
  # selected and the owner deliberately publishes/activates it in n8n.
  n8n-import:
    image: docker.n8n.io/n8nio/n8n:2.31.6
    restart: "no"
    user: node
    environment: *n8n-environment
    entrypoint: ["/bin/sh", "/workflows/import-once.sh"]
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    depends_on:
      n8n:
        condition: service_healthy
    networks: [backend]

  # Automatic HTTPS reverse proxy. Start it on the VPS with:
  # docker compose --profile production up -d --build
  caddy:
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    profiles: [production]
    environment:
      N8N_HOST: ${N8N_HOST:?Set N8N_HOST in .env}
      STUDIO_HOST: ${STUDIO_HOST:?Set STUDIO_HOST in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      n8n:
        condition: service_healthy
    networks: [backend]

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  n8n_data:
  video_data:
  caddy_data:
  caddy_config:
